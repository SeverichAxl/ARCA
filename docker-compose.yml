name: arca

x-service-common: &service-common
  build:
    context: .
    dockerfile: docker/Dockerfile.service
  restart: unless-stopped
  networks:
    - arca-net
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    container_name: arca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_DB_OWNER_PASSWORD: ${AUTH_DB_OWNER_PASSWORD}
      AUTH_DB_APP_PASSWORD: ${AUTH_DB_APP_PASSWORD}
      PERSONAL_DB_OWNER_PASSWORD: ${PERSONAL_DB_OWNER_PASSWORD}
      PERSONAL_DB_APP_PASSWORD: ${PERSONAL_DB_APP_PASSWORD}
      VACACIONES_DB_OWNER_PASSWORD: ${VACACIONES_DB_OWNER_PASSWORD}
      VACACIONES_DB_APP_PASSWORD: ${VACACIONES_DB_APP_PASSWORD}
      CONTRATOS_DB_OWNER_PASSWORD: ${CONTRATOS_DB_OWNER_PASSWORD}
      CONTRATOS_DB_APP_PASSWORD: ${CONTRATOS_DB_APP_PASSWORD}
      PLANILLAS_DB_OWNER_PASSWORD: ${PLANILLAS_DB_OWNER_PASSWORD}
      PLANILLAS_DB_APP_PASSWORD: ${PLANILLAS_DB_APP_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - arca-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: arca-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: arca
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - arca-net

  rabbitmq-init:
    image: curlimages/curl:8.10.1
    container_name: arca-rabbitmq-init
    restart: 'no'
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ADMIN_USER: ${RABBITMQ_DEFAULT_USER}
      ADMIN_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      AUTH_USER: ${RABBITMQ_MS_AUTH_USER:-ms_auth}
      AUTH_PASSWORD: ${RABBITMQ_MS_AUTH_PASSWORD:-change_me_ms_auth_rabbit_password}
      PERSONAL_USER: ${RABBITMQ_MS_PERSONAL_USER:-ms_personal}
      PERSONAL_PASSWORD: ${RABBITMQ_MS_PERSONAL_PASSWORD:-change_me_ms_personal_rabbit_password}
      VACACIONES_USER: ${RABBITMQ_MS_VACACIONES_USER:-ms_vacaciones}
      VACACIONES_PASSWORD: ${RABBITMQ_MS_VACACIONES_PASSWORD:-change_me_ms_vacaciones_rabbit_password}
      CONTRATOS_USER: ${RABBITMQ_MS_CONTRATOS_USER:-ms_contratos}
      CONTRATOS_PASSWORD: ${RABBITMQ_MS_CONTRATOS_PASSWORD:-change_me_ms_contratos_rabbit_password}
      PLANILLAS_USER: ${RABBITMQ_MS_PLANILLAS_USER:-ms_planillas}
      PLANILLAS_PASSWORD: ${RABBITMQ_MS_PLANILLAS_PASSWORD:-change_me_ms_planillas_rabbit_password}
    command:
      - sh
      - -ec
      - |
        api() {
          auth=$$(printf '%s:%s' "$$ADMIN_USER" "$$ADMIN_PASSWORD" | base64 | tr -d '\n')
          curl --fail --silent --show-error -H "Authorization: Basic $$auth" "$$@"
        }
        create_user() {
          api -X PUT "http://rabbitmq:15672/api/users/$$1" \
            -H 'content-type: application/json' \
            --data "{\"password\":\"$$2\",\"tags\":\"\"}"
          api -X PUT "http://rabbitmq:15672/api/permissions/arca/$$1" \
            -H 'content-type: application/json' \
            --data "{\"configure\":\"$$3\",\"write\":\"$$4\",\"read\":\"$$5\"}"
        }
        attempt=0
        until api -X PUT http://rabbitmq:15672/api/vhosts/arca; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo 'RabbitMQ management API did not become ready after 60 seconds.' >&2
            exit 1
          fi
          sleep 2
        done
        create_user "$$AUTH_USER" "$$AUTH_PASSWORD" '^(arca[.]events|auth[.]auditoria([.]retry|[.]dlq)?)$$' '^(arca[.]events|auth[.]auditoria([.]retry|[.]dlq)?)$$' '^auth[.]auditoria$$'
        create_user "$$PERSONAL_USER" "$$PERSONAL_PASSWORD" '^arca[.]events$$' '^arca[.]events$$' '^$$'
        create_user "$$VACACIONES_USER" "$$VACACIONES_PASSWORD" '^(arca[.]events|vacaciones[.]personal-events([.]retry|[.]dlq)?)$$' '^(arca[.]events|vacaciones[.]personal-events([.]retry|[.]dlq)?)$$' '^vacaciones[.]personal-events$$'
        create_user "$$CONTRATOS_USER" "$$CONTRATOS_PASSWORD" '^$$' '^$$' '^$$'
        create_user "$$PLANILLAS_USER" "$$PLANILLAS_PASSWORD" '^$$' '^$$' '^$$'
    networks:
      - arca-net

  ms-auth:
    <<: *service-common
    container_name: arca-ms-auth
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ms-auth
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4001
      SERVICE_NAME: ms-auth
      DATABASE_URL: ${AUTH_DATABASE_URL}
      DIRECT_URL: ${AUTH_DIRECT_URL}
      RUN_SEED: ${RUN_SEED_AUTH:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      INTERNAL_HMAC_KEY: ${INTERNAL_HMAC_KEY:-REPLACE_WITH_RANDOM_32_BYTE_BASE64_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_KID: ${JWT_KID}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: arca
      RABBITMQ_USER: ${RABBITMQ_MS_AUTH_USER:-ms_auth}
      RABBITMQ_PASSWORD: ${RABBITMQ_MS_AUTH_PASSWORD:-change_me_ms_auth_rabbit_password}
      RABBITMQ_RETRY_TTL_MS: ${RABBITMQ_RETRY_TTL_MS:-10000}
    expose:
      - '4001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:4001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  ms-personal:
    <<: *service-common
    container_name: arca-ms-personal
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ms-personal
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4002
      SERVICE_NAME: ms-personal
      DATABASE_URL: ${PERSONAL_DATABASE_URL}
      DIRECT_URL: ${PERSONAL_DIRECT_URL}
      RUN_SEED: ${RUN_SEED_PERSONAL:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      INTERNAL_HMAC_KEY: ${INTERNAL_HMAC_KEY:-REPLACE_WITH_RANDOM_32_BYTE_BASE64_KEY}
      ENC_KEY_PERSONAL: ${ENC_KEY_PERSONAL}
      CI_HMAC_KEY: ${CI_HMAC_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-arca/documentos}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: arca
      RABBITMQ_USER: ${RABBITMQ_MS_PERSONAL_USER:-ms_personal}
      RABBITMQ_PASSWORD: ${RABBITMQ_MS_PERSONAL_PASSWORD:-change_me_ms_personal_rabbit_password}
      RABBITMQ_RETRY_TTL_MS: ${RABBITMQ_RETRY_TTL_MS:-10000}
    expose:
      - '4002'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:4002/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  ms-vacaciones:
    <<: *service-common
    container_name: arca-ms-vacaciones
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ms-vacaciones
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4003
      SERVICE_NAME: ms-vacaciones
      DATABASE_URL: ${VACACIONES_DATABASE_URL}
      DIRECT_URL: ${VACACIONES_DIRECT_URL}
      RUN_SEED: ${RUN_SEED_VACACIONES:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      INTERNAL_HMAC_KEY: ${INTERNAL_HMAC_KEY:-REPLACE_WITH_RANDOM_32_BYTE_BASE64_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: arca
      RABBITMQ_USER: ${RABBITMQ_MS_VACACIONES_USER:-ms_vacaciones}
      RABBITMQ_PASSWORD: ${RABBITMQ_MS_VACACIONES_PASSWORD:-change_me_ms_vacaciones_rabbit_password}
      RABBITMQ_RETRY_TTL_MS: ${RABBITMQ_RETRY_TTL_MS:-10000}
    expose:
      - '4003'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:4003/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  ms-contratos:
    <<: *service-common
    container_name: arca-ms-contratos
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ms-contratos
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4004
      SERVICE_NAME: ms-contratos
      DATABASE_URL: ${CONTRATOS_DATABASE_URL}
      DIRECT_URL: ${CONTRATOS_DIRECT_URL}
      RUN_SEED: 'false'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      INTERNAL_HMAC_KEY: ${INTERNAL_HMAC_KEY:-REPLACE_WITH_RANDOM_32_BYTE_BASE64_KEY}
      ENC_KEY_CONTRATOS: ${ENC_KEY_CONTRATOS}
    expose:
      - '4004'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:4004/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  ms-planillas:
    <<: *service-common
    container_name: arca-ms-planillas
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ms-planillas
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4005
      SERVICE_NAME: ms-planillas
      DATABASE_URL: ${PLANILLAS_DATABASE_URL}
      DIRECT_URL: ${PLANILLAS_DIRECT_URL}
      RUN_SEED: 'false'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      INTERNAL_HMAC_KEY: ${INTERNAL_HMAC_KEY:-REPLACE_WITH_RANDOM_32_BYTE_BASE64_KEY}
      ENC_KEY_PLANILLAS: ${ENC_KEY_PLANILLAS}
    expose:
      - '4005'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:4005/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: api-gateway
    container_name: arca-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      SERVICE_NAME: api-gateway
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:-}
      JWT_KID: ${JWT_KID}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      INTERNAL_HMAC_KEY: ${INTERNAL_HMAC_KEY:-REPLACE_WITH_RANDOM_32_BYTE_BASE64_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://ms-auth:4001}
      PERSONAL_SERVICE_URL: ${PERSONAL_SERVICE_URL:-http://ms-personal:4002}
      VACACIONES_SERVICE_URL: ${VACACIONES_SERVICE_URL:-http://ms-vacaciones:4003}
      CONTRATOS_SERVICE_URL: ${CONTRATOS_SERVICE_URL:-http://ms-contratos:4004}
      PLANILLAS_SERVICE_URL: ${PLANILLAS_SERVICE_URL:-http://ms-planillas:4005}
    ports:
      - '${GATEWAY_PORT:-4000}:4000'
    depends_on:
      ms-auth:
        condition: service_healthy
      ms-personal:
        condition: service_healthy
      ms-vacaciones:
        condition: service_healthy
      ms-contratos:
        condition: service_healthy
      ms-planillas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:4000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - arca-net

  web-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: arca-web-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/login || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - arca-net

volumes:
  pgdata:
  rabbitmqdata:

networks:
  arca-net:
    driver: bridge
